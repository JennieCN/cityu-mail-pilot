# Managed by pilot_app/deploy_pilot.sh — do not edit in place.
#
# A silently failing backup is a data-loss risk, and until this drop-in existed
# nothing on the machine would have said so. The drop-in belongs on the
# service, not the timer: a failed state does not bubble up from a service to
# the timer that activated it (systemd.timer(5)).
[Unit]
OnFailure=cityu-mail-pilot-alert@%N.service
