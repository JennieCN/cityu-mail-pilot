# Managed by pilot_app/deploy_pilot.sh — do not edit in place.
#
# Why the drop-in is on certbot.service and not certbot.timer: a timer only
# activates its same-named service, and a failed state does not bubble up from
# the service to the timer (systemd.timer(5)). Putting OnFailure= on the timer
# would silently never fire.
#
# %N is the failing unit's name with the type suffix removed, which is the
# form systemd's own systemd.unit(5) example uses. %n would keep ".service" and
# produce "cityu-mail-pilot-alert@certbot.service.service".
[Unit]
OnFailure=cityu-mail-pilot-alert@%N.service
